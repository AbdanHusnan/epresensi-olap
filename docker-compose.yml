services:
  postgres-olap:
    image: postgres:16
    container_name: epresensi-olap-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${OLAP_DB}
      POSTGRES_USER: ${OLAP_USER}
      POSTGRES_PASSWORD: ${OLAP_PASSWORD}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olap_admin -d epresensi_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
